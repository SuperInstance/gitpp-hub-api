openapi: 3.1.0
info:
  title: gitpp-hub-api
  version: 0.1.0
  description: |
    HTTP API for the git.pp hub. The write-side counterpart to gitpp-fold-edge.
    Adds records, validates them, computes the digest, stores them, and exposes
    the fold. No DB, no framework, no auth (add a reverse proxy for production).
  contact:
    name: Casey Digennaro
    url: https://github.com/SuperInstance/gitpp-hub-api
servers:
  - url: http://localhost:8788
    description: Local dev
  - url: https://{host}
    description: Self-hosted
    variables:
      host:
        default: gitpp.example.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
  /version:
    get:
      summary: API version
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  sha: { type: string }
  /projects:
    get:
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { type: string }
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  records: { type: integer, minimum: 0 }
  /projects/{project}:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    get:
      summary: Project info
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  records: { type: integer, minimum: 0 }
  /projects/{project}/records:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    get:
      summary: List records
      parameters:
        - { name: after, in: query, schema: { type: string }, description: "ID to paginate after (exclusive)" }
        - { name: limit, in: query, schema: { type: integer, default: 1000 } }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                  total: { type: integer }
    post:
      summary: Add a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Record"
                - type: object
                  properties:
                    record: { $ref: "#/components/schemas/Record" }
                  required: [record]
      responses:
        "201":
          description: Record added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  leaf: { type: string, pattern: "^[a-f0-9]{64}$" }
        "409": { description: "Record already exists" }
        "422": { description: "Invalid record" }
  /projects/{project}/records/{id}:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a record (with computed leaf)
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: { $ref: "#/components/schemas/Record" }
                  leaf: { type: string, pattern: "^[a-f0-9]{64}$" }
        "404": { description: "Record not found" }
  /projects/{project}/nudge:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    post:
      summary: Propose a nudge through the gate
      description: |
        A nudge is a DECISION and an ACTION, and the action's parent is the
        decision record. Two records are written, parented:

            t1  task, status=wip
             |
            receipt-N  witness, effects:{}, reason="gate:<verdict>"   <- decision
             |
            nudge-N   task, status=done                               <- action

        If the gate blocks, ONLY the receipt is written: state does not
        move, but the attempt is on the record permanently and
        tamper-evidently. Because the action is parented on the receipt,
        deleting the receipt makes the action an orphan whose closure root
        is null -- you cannot hold an action without the decision that
        licensed it.

        The parent check is exact and offline (parents[0] === setters[key]).
        The intent check is a calibrated structured decision and is
        OPTIONAL; with no signal the gate fails CLOSED.

        Measured routing:
          no intent signal  -> block   (receipt only, stateUnchanged)
          intent < threshold -> review (receipt only)
          intent >= threshold -> act   (action written, landed:true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:    { type: string }
                value:  {}
                reason: { type: string }
                kind:   { type: string, enum: [task, witness, override] }
                intent:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: >
                    Calibrated probability that this nudge is well-founded.
                    Omit for a parent-only gate, which still fails closed.
                dryRun:
                  type: boolean
                  description: Evaluate and report without persisting.
      responses:
        "201":
          description: Routed; acted, reviewed, or blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  routed: { type: string, enum: [act, review, block] }
                  reason: { type: string }
                  receipt: { $ref: "#/components/schemas/Record" }
                  action:
                    oneOf:
                      - { $ref: "#/components/schemas/Record" }
                      - { type: "null" }
                  landed:
                    type: boolean
                    description: >
                      True only if this action IS the setter. Not "the value
                      matches" -- a lower-class nudge carrying the same value
                      would satisfy that, and would be wrong.
                  setterNow: { type: [string, "null"] }
                  state: { type: object, additionalProperties: true }
                  dryRun: { type: boolean }
        "202":
          description: >
            Blocked before the action. The receipt is persisted and the
            state is unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  routed: { type: string, const: block }
                  reason: { type: string }
                  receipt: { $ref: "#/components/schemas/Record" }
                  action: { type: "null" }
                  stateUnchanged: { type: boolean, const: true }
        "400": { description: "missing 'key' or 'value'" }
  /projects/{project}/fold:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    post:
      summary: Fold the project's record set
      responses:
        "200":
          description: Fold result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoldResult" }
  /projects/{project}/verify:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    post:
      summary: Verify a checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint]
              properties:
                checkpoint: { $ref: "#/components/schemas/Checkpoint" }
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
  /projects/{project}/root:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    post:
      summary: Compute closure root at a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at]
              properties:
                at: { type: string }
      responses:
        "200":
          description: Closure root
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { type: string, pattern: "^[a-f0-9]{64}$" }
components:
  schemas:
    Record:
      type: object
      required: [id, kind, parents, effects, reason]
      properties:
        id: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [task, witness, override]
        parents:
          type: array
          items: { type: string }
        effects:
          type: object
          additionalProperties: true
        reason:
          type: [string, "null"]
        digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: "v2 dialect: SHA-256 of the canonical form (runner writes, worker verifies)"
    FoldResult:
      type: object
      required: [state, setters, order, conflicts, orphans]
      properties:
        state:
          type: object
          additionalProperties: true
        setters:
          type: object
          additionalProperties: { type: string }
          description: >
            Spec 5.6: which record sets each key, for EVERY key in state,
            not only contested ones. This is what makes a nudge reliably
            authorable -- parent on setters[key] and it lands, whatever
            the nudge id sorts as.
        order:
          type: array
          items: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              winner: { type: string }
              losers:
                type: array
                items: { type: string }
        orphans:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string }
              missingParents:
                type: array
                items: { type: string }
    Checkpoint:
      type: object
      required: [at, state, closureRoot]
      properties:
        at: { type: string }
        state:
          type: object
          additionalProperties: true
        closureRoot: { type: string, pattern: "^[a-f0-9]{64}$" }
    VerifyResult:
      type: object
      required: [verdict, closureRoot, state]
      properties:
        verdict:
          type: string
          enum: [VERIFIED, STATE-ONLY, MISMATCH]
        closureRoot: { type: string }
        expectedRoot:
          type: [string, "null"]
        state:
          type: object
          additionalProperties: true
        stateDiff:
          type: object
          properties:
            onlyInLive: { type: object, additionalProperties: true }
            onlyInExpected: { type: object, additionalProperties: true }
